[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  DISABLE_NETLIFY_HUD = "true"
  NETLIFY_DISABLE_HUD = "true"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
